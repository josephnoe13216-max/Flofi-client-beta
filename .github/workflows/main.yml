name: Build Flofi Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Flofi Client
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FlofiClient-jar
          path: build/libs/*.jar
